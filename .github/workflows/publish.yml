name: Publish Package to PyPI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Check release version and publication status
        id: pypi
        run: |
          python - <<'PY'
          import json
          import os
          import runpy
          import urllib.error
          import urllib.request
          import zipfile
          from email.parser import BytesParser
          from pathlib import Path

          version = runpy.run_path("noweda/_version.py")["__version__"]
          wheel, = Path("dist").glob("*.whl")
          with zipfile.ZipFile(wheel) as archive:
              metadata, = [n for n in archive.namelist() if n.endswith(".dist-info/METADATA")]
              assert BytesParser().parsebytes(archive.read(metadata))["Version"] == version
          try:
              with urllib.request.urlopen(f"https://pypi.org/pypi/noweda/{version}/json", timeout=20) as response:
                  json.load(response)
              published = True
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              published = False
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              print(f"published={str(published).lower()}", file=handle)
          PY
      - name: Install publishing tools
        if: steps.pypi.outputs.published != 'true'
        run: python -m pip install twine
      - name: Publish checked distributions
        if: steps.pypi.outputs.published != 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive dist/*
