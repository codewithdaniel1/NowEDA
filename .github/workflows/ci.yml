name: Test and build

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.8'
            pandas: 'pandas==1.3.5'
            numpy: 'numpy<1.25'
          - python: '3.11'
            pandas: 'pandas>=2.3,<3'
            numpy: 'numpy>=1.26'
          - python: '3.11'
            pandas: 'pandas>=3,<4'
            numpy: 'numpy>=2'
          - python: '3.13'
            pandas: 'pandas>=3,<4'
            numpy: 'numpy>=2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install ".[test]" "${{ matrix.pandas }}" "${{ matrix.numpy }}"
      - name: Test
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests/ -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build twine 'readme_renderer[md]' 'mkdocs<2' mkdocs-material mkdocs-autorefs
      - run: python -m mkdocs build --strict
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Verify README labels render as bold
        run: |
          python - <<'PY'
          from pathlib import Path
          from html import escape
          from readme_renderer.markdown import render
          html = render(Path("README.md").read_text())
          assert html is not None
          for label in ["Supported problem types", "Supervised tasks",
                        "Unsupervised tasks", "Honest guidance"]:
              assert f"<strong>{escape(label)}</strong>" in html, label
          PY
      - name: Install and smoke-test the built wheel outside the source tree
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import pandas as pd
          import noweda
          df = pd.DataFrame({"email": ["example@example.org"]})
          assert df.eda.summary()["pii"]["email"]["email"] == 1
          assert noweda.__version__
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
